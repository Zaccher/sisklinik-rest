#==========================================================
#= PARAMETRI APPLICATIVI 
#==========================================================
spring.application.name=jwtAuthModule
server.port=9100
logging.level.org.springframework.security=DEBUG

#==========================================================
#= PARAMETRI DBMS POSTGRESQL 
#==========================================================
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.datasource.password=123_stella
spring.datasource.url=jdbc\:postgresql\://localhost\:5432/sisklinik
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
#questo serve per settare il nome delle table di audit nel db
spring.jpa.properties.org.hibernate.envers.audit_table_prefix=z_
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=

# ==============================================================    
#= Opzioni per Jackson serializzazione e de-serializzazione
#= Per default Jackson genera un'eccezione se incontra un oggetto 
#= vuoto durante la serializzazione. Quindi l'andiamo a disabilitare 
#= in modo tale da non avere eccezioni. Questa cosa serve soprattutto
#= nelle relazioni tra entita che hanno un caricamento pigro (LAZY)          
# ==============================================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

#==========================================================
#= PARAMETRI TOMCAT 
#==========================================================
server.tomcat.relaxed-query-chars=|,{,},[,],^

# ==============================================================
# = Parametri Sicurezza JWT 
# ==============================================================
sicurezza.uri=/auth
sicurezza.refresh=/refresh
sicurezza.header=Authorization
sicurezza.prefix=Bearer 
sicurezza.expiration=1200
sicurezza.secret=$123_Stella@sisklinik.it
